<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Berita... | Balmon Samarinda</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Source Sans 3', sans-serif; background-color: #f8f9fa; color: #333; }
        
        /* Header Artikel */
        .article-header { padding: 3rem 0; background: white; border-bottom: 1px solid #e9ecef; margin-bottom: 2rem; }
        .meta-data { font-size: 0.9rem; color: #6c757d; }
        .meta-item { margin-right: 1.5rem; display: inline-flex; align-items: center; gap: 5px; }

        /* Gambar Utama */
        .article-featured-img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        /* Isi Artikel */
        .article-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #2c3e50;
            white-space: pre-wrap; /* Agar enter terbaca */
            text-align: justify;
        }

        /* Sidebar */
        .sidebar-card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #eee; }
        .sidebar-title { font-weight: 700; border-bottom: 2px solid #0d6efd; padding-bottom: 0.5rem; margin-bottom: 1rem; display: inline-block; }
        
        .recent-post-item { display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 1px solid #f0f0f0; padding-bottom: 1rem; }
        .recent-post-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .recent-post-title { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 0.2rem; }
        .recent-post-title a { text-decoration: none; color: #333; transition: color 0.2s; }
        .recent-post-title a:hover { color: #0d6efd; }

        /* Loading Skeleton */
        .skeleton { background: #eee; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">BALMON SAMARINDA</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Berita</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="error-area" class="container mt-5 text-center d-none">
        <div class="alert alert-warning py-5 shadow-sm">
            <h2 class="fw-bold">Berita Tidak Ditemukan</h2>
            <p class="lead">ID tidak valid atau data telah dihapus dari database.</p>
            <p class="small text-muted">ID: <span id="debug-id-display">-</span></p>
            <a href="index.html" class="btn btn-primary mt-3">Kembali ke Beranda</a>
        </div>
    </div>

    <main id="main-content">
        <section class="article-header">
            <div class="container">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-3">
                        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Beranda</a></li>
                        <li class="breadcrumb-item active" id="breadcrumb-title">Memuat...</li>
                    </ol>
                </nav>
                
                <h1 class="display-5 fw-bold mb-3" id="article-title">
                    <span class="skeleton d-inline-block w-75" style="height: 50px;"></span>
                </h1>
                
                <div class="meta-data">
                    <span class="meta-item"><i class="bi bi-calendar3"></i> <span id="article-date">--/--/----</span></span>
                    <span class="meta-item"><i class="bi bi-tag-fill"></i> <span id="article-category">News</span></span>
                </div>
            </div>
        </section>

        <div class="container pb-5">
            <div class="row">
                <div class="col-lg-8">
                    <div id="img-container">
                        <div class="skeleton article-featured-img" style="height: 300px;"></div>
                    </div>

                    <article class="article-content mt-4" id="article-body">
                        <div class="skeleton w-100 mb-2" style="height: 20px;"></div>
                        <div class="skeleton w-100 mb-2" style="height: 20px;"></div>
                        <div class="skeleton w-100 mb-2" style="height: 20px;"></div>
                    </article>
                </div>

                <div class="col-lg-4 mt-5 mt-lg-0">
                    <div class="sidebar-card">
                        <h5 class="sidebar-title">Publikasi Terbaru</h5>
                        <div id="recent-posts-container">
                            <div class="text-center py-3">
                                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <small>&copy; 2026 Balai Monitor Spektrum Frekuensi Radio Kelas I Samarinda</small>
        </div>
    </footer>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDUeIg9Zn_xndPXtChO8KufXFp6EMtqBJ0",
        authDomain: "admin-pelayanan-balmon.firebaseapp.com",
        projectId: "admin-pelayanan-balmon",
        storageBucket: "admin-pelayanan-balmon.firebasestorage.app",
        messagingSenderId: "1071557110255",
        appId: "1:1071557110255:web:bff7087da1feacccb7ee1a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    async function loadNewsDetail() {
        const newsId = getQueryParam('id'); 
        const errorArea = document.getElementById('error-area');
        const mainContent = document.getElementById('main-content');

        if (!newsId) {
            mainContent.classList.add('d-none');
            errorArea.classList.remove('d-none');
            return;
        }

        // Jalur database: Pastikan menggunakan 'galeri/'
        const newsRef = ref(db, `galeri/${newsId}`); 

        try {
            const snapshot = await get(newsRef);

            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // --- UPDATE HTML (Menyesuaikan dengan ID di HTML Anda) ---
                
                // 1. Update Judul & Breadcrumb
                document.getElementById('article-title').innerText = data.title || "Tanpa Judul";
                document.getElementById('breadcrumb-title').innerText = data.title || "Berita";
                document.title = `${data.title} | Balmon Samarinda`;

                // 2. Update Tanggal & Kategori
                document.getElementById('article-date').innerText = data.date || "-";
                document.getElementById('article-category').innerText = data.category || "News";

                // 3. Update Gambar Utama
                const imgContainer = document.getElementById('img-container');
                if (data.imageUrl) {
                    imgContainer.innerHTML = `<img src="${data.imageUrl}" class="article-featured-img" alt="${data.title}">`;
                }

                // 4. Update Isi Konten
                const bodyEl = document.getElementById('article-body');
                if (bodyEl) {
                    // Karena css Anda punya white-space: pre-wrap, \n otomatis jadi baris baru
                    bodyEl.innerText = data.description || "Tidak ada isi berita.";
                }

                // 5. Muat Sidebar (Publikasi Terbaru)
                loadRecentPosts();

            } else {
                mainContent.classList.add('d-none');
                errorArea.classList.remove('d-none');
                document.getElementById('debug-id-display').innerText = newsId;
            }
        } catch (error) {
            console.error("Gagal mengambil data:", error);
            alert("Terjadi kesalahan koneksi ke database.");
        }
    }

    // Fungsi tambahan untuk mengisi sidebar agar tidak kosong
    async function loadRecentPosts() {
        const recentRef = ref(db, 'galeri');
        try {
            const snapshot = await get(recentRef);
            if (snapshot.exists()) {
                const data = snapshot.val();
                let items = Object.entries(data)
                    .map(([key, val]) => ({ key, ...val }))
                    .filter(item => item.category === 'news') // Hanya ambil kategori news
                    .slice(0, 5); // Ambil 5 terbaru

                const container = document.getElementById('recent-posts-container');
                container.innerHTML = items.map(item => `
                    <div class="recent-post-item">
                        <img src="${item.imageUrl}" class="recent-post-img">
                        <div>
                            <div class="recent-post-title">
                                <a href="news_detail.html?id=${item.key}">${item.title}</a>
                            </div>
                            <small class="text-muted">${item.date || ''}</small>
                        </div>
                    </div>
                `).join('');
            }
        } catch (e) { console.error(e); }
    }

    loadNewsDetail();
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
