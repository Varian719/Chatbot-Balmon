<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Publikasi - Balmon Samarinda</title>
    
    <link rel="icon" type="image/png" href="logo-ikon.png">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" />

    <style>
        /* --- 1. GLOBAL STYLE --- */
        :root {
            --primary-color: #006fb0;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --bg-light: #f4f9fc;
        }
        body { margin: 0; font-family: 'Albert Sans', sans-serif; background: var(--bg-light); color: var(--text-dark); }
        a { text-decoration: none; color: inherit; }
        * { box-sizing: border-box; }

        /* --- 2. LOADER --- */
        .page-loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .page-loader.hidden { opacity: 0; visibility: hidden; }
        .spinner { width: 50px; height: 50px; border: 4px solid #eee; border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- 3. HEADER & HERO --- */
        header { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .brand { font-weight: 800; color: var(--primary-color); font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .nav-link { margin-left: 20px; font-weight: 600; font-size: 14px; color: var(--text-dark); transition: 0.3s; }
        .nav-link:hover { color: var(--primary-color); }
        
        .hero { padding: 140px 20px 60px; text-align: center; background: linear-gradient(135deg, #006fb0 0%, #004085 100%); color: #fff; }
        .hero h1 { font-size: 36px; margin: 0 0 10px; }
        .hero p { opacity: 0.8; margin: 0; }

        /* --- 4. FILTER CARDS (GRID) --- */
        .filter-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; max-width: 800px; margin: -40px auto 40px; padding: 0 20px; position: relative; z-index: 10; }
        .f-card { background: #fff; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: 0.3s; border: 2px solid transparent; }
        .f-card:hover { transform: translateY(-3px); }
        .f-card.active { border-color: var(--primary-color); background: #f0f9ff; }
        .f-card i { font-size: 24px; color: var(--text-gray); margin-bottom: 5px; display: block; }
        .f-card.active i { color: var(--primary-color); }
        .f-name { font-size: 13px; font-weight: 700; color: var(--text-gray); }
        .f-card.active .f-name { color: var(--primary-color); }

        /* --- 5. GALLERY GRID --- */
        .gallery-container { max-width: 1200px; margin: 0 auto; padding: 0 20px 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .g-item { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; animation: fadeIn 0.6s ease; }
        .g-item:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .g-item.hidden { display: none; }
        
        .g-media { position: relative; aspect-ratio: 4/3; cursor: pointer; overflow: hidden; }
        .g-media img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .g-item:hover .g-media img { transform: scale(1.05); }
        
        .g-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.3); opacity: 0; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .g-item:hover .g-overlay { opacity: 1; }
        .g-icon { width: 45px; height: 45px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-color); font-size: 20px; }
        
        .g-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; font-weight: 700; }
        
        .g-info { padding: 15px; }
        .g-date { font-size: 11px; color: var(--text-gray); display: block; margin-bottom: 5px; }
        .g-title { font-size: 15px; font-weight: 700; margin: 0; line-height: 1.4; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 6. LIGHTBOX --- */
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.3s; }
        .lightbox.active { opacity: 1; visibility: visible; }
        .lb-content { max-width: 90vw; max-height: 80vh; position: relative; }
        .lb-media { max-width: 100%; max-height: 80vh; border-radius: 8px; }
        .lb-close { position: absolute; top: -40px; right: 0; color: #fff; font-size: 30px; cursor: pointer; }
        .lb-caption { color: #fff; text-align: center; margin-top: 10px; font-weight: 600; }
    </style>
</head>
<body>

    <div id="loader" class="page-loader"><div class="spinner"></div></div>

    <header>
        <div class="brand">
            <img src="logo-ikon.png" alt="Logo" height="35">
            BALMON SAMARINDA
        </div>
        <nav>
            <a href="index.html" class="nav-link">Beranda</a>
            <a href="galeri.html" class="nav-link" style="color:var(--primary-color)">Galeri</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Galeri Publikasi</h1>
        <p>Dokumentasi kegiatan dan arsip digital Balai Monitor Samarinda</p>
    </div>

    <div class="filter-wrapper">
        <div class="f-card active" onclick="filterGallery('all', this)">
            <i class="bi bi-grid-fill"></i> <span class="f-name">Semua</span>
        </div>
        <div class="f-card" onclick="filterGallery('foto', this)">
            <i class="bi bi-camera-fill"></i> <span class="f-name">Foto</span>
        </div>
        <div class="f-card" onclick="filterGallery('video', this)">
            <i class="bi bi-play-btn-fill"></i> <span class="f-name">Video</span>
        </div>
        <div class="f-card" onclick="filterGallery('infografis', this)">
            <i class="bi bi-pie-chart-fill"></i> <span class="f-name">Info</span>
        </div>
    </div>

    <div class="gallery-container" id="galleryContainer">
        <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #888;">
            Menghubungkan ke server...
        </div>
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <div class="lb-content">
            <span class="lb-close" onclick="closeLightbox(event)">&times;</span>
            <img id="lbImg" class="lb-media" style="display:none;">
            <iframe id="lbVideo" class="lb-media" width="800" height="450" frameborder="0" allowfullscreen style="display:none; background:#000;"></iframe>
            <div id="lbCaption" class="lb-caption"></div>
        </div>
    </div>

    <script>
        // 1. Loader & Filter UI
        window.onload = () => document.getElementById('loader').classList.add('hidden');

        window.filterGallery = function(cat, btn) {
            document.querySelectorAll('.f-card').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            
            document.querySelectorAll('.g-item').forEach(item => {
                if(cat === 'all' || item.dataset.category === cat) {
                    item.classList.remove('hidden');
                    item.style.animation = 'none';
                    item.offsetHeight; /* trigger reflow */
                    item.style.animation = 'fadeIn 0.6s ease';
                } else {
                    item.classList.add('hidden');
                }
            });
        }

        // 2. Lightbox Logic
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');
        const lbVid = document.getElementById('lbVideo');
        const lbCap = document.getElementById('lbCaption');

        window.openLightbox = function(el, type) {
            const parent = el.closest('.g-item');
            lbCap.innerText = parent.querySelector('.g-title').innerText;
            lb.classList.add('active');

            if(type === 'image') {
                lbImg.src = el.querySelector('img').src;
                lbImg.style.display = 'block';
                lbVid.style.display = 'none';
                lbVid.src = "";
            } else {
                lbVid.src = parent.dataset.videoSrc;
                lbVid.style.display = 'block';
                lbImg.style.display = 'none';
            }
        }

        window.closeLightbox = function(e) {
            if(e.target.id === 'lightbox' || e.target.classList.contains('lb-close')) {
                lb.classList.remove('active');
                lbVid.src = "";
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ================================================================
        // PENTING: ISI BAGIAN INI DENGAN CONFIG ANDA YANG BENAR
        // Dapatkan ini di: Firebase Console > Project Settings > General > Your Apps
        // ================================================================
        const firebaseConfig = {
            apiKey: "GANTI_DENGAN_API_KEY_ANDA",
            authDomain: "GANTI_DENGAN_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://GANTI_DENGAN_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "GANTI_DENGAN_PROJECT_ID",
            storageBucket: "GANTI_DENGAN_PROJECT_ID.appspot.com",
            messagingSenderId: "GANTI_DENGAN_SENDER_ID",
            appId: "GANTI_DENGAN_APP_ID"
        };
        // ================================================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const container = document.getElementById('galleryContainer');

        onValue(ref(db, 'galeri'), (snapshot) => {
            container.innerHTML = "";
            if (!snapshot.exists()) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 50px;">Belum ada konten galeri.</div>`;
                return;
            }

            const data = snapshot.val();
            let items = Object.values(data).sort((a,b) => b.timestamp - a.timestamp);

            items.forEach(item => {
                const isVideo = item.category === 'video';
                const typeParam = isVideo ? "'video'" : "'image'";
                const iconClass = isVideo ? 'bi-play-fill' : 'bi-zoom-in';
                const dateStr = new Date(item.date).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});

                const html = `
                    <div class="g-item" data-category="${item.category}" data-video-src="${item.videoUrl}">
                        <div class="g-media" onclick="openLightbox(this, ${typeParam})">
                            <img src="${item.imageUrl}" alt="${item.title}" loading="lazy">
                            <div class="g-overlay"><div class="g-icon"><i class="${iconClass}"></i></div></div>
                            <div class="g-badge" style="background:${getBadgeColor(item.category)}">${item.category}</div>
                        </div>
                        <div class="g-info">
                            <span class="g-date"><i class="bi bi-calendar"></i> ${dateStr}</span>
                            <h3 class="g-title">${item.title}</h3>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
            
            // Re-apply filter jika ada tombol aktif
            const activeBtn = document.querySelector('.f-card.active');
            if(activeBtn) {
                const cat = activeBtn.getAttribute('onclick').match(/'([^']+)'/)[1];
                window.filterGallery(cat, activeBtn);
            }
        });

        function getBadgeColor(cat) {
            if(cat === 'video') return '#dc3545';
            if(cat === 'infografis') return '#198754';
            return '#006fb0';
        }
    </script>

</body>
</html>
