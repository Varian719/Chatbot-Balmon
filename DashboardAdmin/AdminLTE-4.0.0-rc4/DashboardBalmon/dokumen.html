<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Admin Balmon | Manajemen Arsip Aman</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

  <style>
    /* Styling Tambahan */
    .card-doc { transition: transform 0.2s, box-shadow 0.2s; cursor: default; }
    .card-doc:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #aaa; }
    
    /* Tombol Google di Navbar */
    #authorize_button, #signout_button { transition: all 0.3s; }
  </style>
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

  <div class="app-wrapper">

    <nav class="app-header navbar navbar-expand bg-body shadow-sm">
      <div class="container-fluid">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#"><i class="bi bi-list"></i></a></li>
          <li class="nav-item"><span class="nav-link fw-bold text-primary">Panel Admin Arsip</span></li>
        </ul>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item d-none d-md-block me-3">
                <span class="nav-link text-muted" id="user-display">Checking...</span>
            </li>
            <li class="nav-item">
                <button id="authorize_button" class="btn btn-primary btn-sm me-2 shadow-sm" style="display: none;">
                    <i class="bi bi-google"></i> Login Drive
                </button>
                <button id="signout_button" class="btn btn-outline-secondary btn-sm me-2 shadow-sm" style="display: none;">
                    <i class="bi bi-cloud-slash"></i> Logout Drive
                </button>
                
                <button id="btnSystemLogout" class="btn btn-danger btn-sm shadow-sm">
                    <i class="bi bi-power"></i> Keluar
                </button>
            </li>
        </ul>
      </div>
    </nav>

    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
      <div class="sidebar-brand">
        <a href="#" class="brand-link text-center">
          <span class="brand-text fw-bold">BALMON SAMARINDA</span>
        </a>
      </div>
      <div class="sidebar-wrapper">
        <nav class="mt-2">
          <ul class="nav sidebar-menu flex-column">
            <li class="nav-item"><a href="admin-balmon.html" class="nav-link"><i class="nav-icon bi bi-speedometer"></i><p>Dashboard</p></a></li>
            <li class="nav-item"><a href="dokumen.html" class="nav-link active"><i class="nav-icon bi bi-folder-fill"></i><p>Arsip Digital</p></a></li>
            <li class="nav-item"><a href="gform_management.html" class="nav-link"><i class="nav-icon bi bi-ui-checks"></i><p>Manajemen GForm</p></a></li>
            <li class="nav-item"><a href="../../../frontend/index.html" target="_blank" class="nav-link"><i class="nav-icon bi bi-globe"></i><p>Lihat Website</p></a></li>
          </ul>
        </nav>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-gradient-primary text-white" style="background: linear-gradient(45deg, #006fb0, #00ace0);">
              <h5 class="card-title mb-0"><i class="bi bi-cloud-arrow-up-fill"></i> Upload Dokumen Baru</h5>
            </div>
            <div class="card-body">
              <div class="alert alert-light border py-2 mb-3 d-flex align-items-center gap-2" id="drive-status">
                <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                <small>Memeriksa status koneksi Google Drive...</small>
              </div>

              <div class="row g-3 align-items-end">
                <div class="col-md-5">
                  <label class="form-label fw-bold">Judul Dokumen</label>
                  <input type="text" id="docJudul" class="form-control" placeholder="Contoh: Surat Edaran No. 5 Tahun 2024">
                </div>
                <div class="col-md-5">
                  <label class="form-label fw-bold">Pilih File (PDF/Word)</label>
                  <input type="file" id="docFile" class="form-control" accept=".pdf,.doc,.docx">
                </div>
                <div class="col-md-2">
                  <button onclick="uploadToDrive()" id="btnUpload" class="btn btn-primary w-100 fw-bold" disabled>
                    <i class="bi bi-upload"></i> UPLOAD
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h5 class="text-secondary m-0"><i class="bi bi-database-check"></i> Arsip Tersimpan</h5>
            <div class="input-group" style="width: 300px;">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                <input type="text" id="searchBox" class="form-control border-start-0" placeholder="Cari judul dokumen...">
            </div>
          </div>

          <div class="row" id="gridDokumen">
             <div class="col-12 text-center py-5">
                 <div class="spinner-border text-primary" role="status"></div>
                 <p class="mt-2 text-muted">Mengambil data aman dari Firebase...</p>
             </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

  <script type="module">
    // 1. Import Modul Keamanan & Firebase Modular
    import { initAdminPage } from "./security.js";
    import { ref, push, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 2. Variabel Global untuk Halaman Ini
    let dbInstance; 
    let authInstance;
    let allDocs = [];
    const TARGET_FOLDER_ID = '1EUgbh4L8nh9J8X2EDc1s0KhnrqQGQmzL'; // ID Folder Drive Anda
    const CLIENT_ID = '1053263347737-g32v5386cnfl8dbe49i0t9i9pv9fg44t.apps.googleusercontent.com'; 
    const API_KEY = 'AIzaSyAcIVdG6dQxewbNNlvRCWb0yGjCWoeqdE4'; 
    const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    
    // =========================================================
    // 3. JALANKAN LOGIKA UTAMA SETELAH LOGIN AMAN
    // =========================================================
    initAdminPage((user, db, auth) => {
        console.log("Halaman Dokumen Siap. User: " + user.email);
        
        // --- PERBAIKAN DI SINI: Update teks "Checking..." menjadi email user ---
        const userDisplay = document.getElementById('user-display');
        if(userDisplay) userDisplay.innerText = user.email;
        // ----------------------------------------------------------------------

        dbInstance = db; 
        authInstance = auth;
        
        // Load Data dari Firebase (Realtime)
        const arsipRef = ref(db, 'arsip_drive');
        onValue(arsipRef, (snapshot) => {
            const grid = document.getElementById('gridDokumen');
            if(!snapshot.exists()) {
                allDocs = [];
                renderGrid(allDocs);
                return;
            }

            allDocs = [];
            snapshot.forEach(child => { 
                allDocs.push({ key: child.key, ...child.val() }); 
            });
            
            // Urutkan Terbaru di Atas
            allDocs.sort((a, b) => b.timestamp - a.timestamp);
            renderGrid(allDocs);
        });
    });

    // Logout Button Logic (Manual Binding karena module)
    document.getElementById('btnSystemLogout').addEventListener('click', () => {
        if(authInstance) {
             Swal.fire({
                title: 'Keluar Sistem?',
                text: "Sesi anda akan diakhiri.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, Keluar',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    signOut(authInstance).then(() => {
                        window.location.replace("login_balmon.html");
                    });
                }
            });
        }
    });

    // =========================================================
    // 4. FUNGSI RENDER TAMPILAN
    // =========================================================
    function renderGrid(dataList) {
        const grid = document.getElementById('gridDokumen');
        if(dataList.length === 0) {
            grid.innerHTML = `<div class="col-12 text-center text-muted py-5"><i class="bi bi-folder-x display-1 opacity-25"></i><p class="mt-3">Tidak ada dokumen ditemukan.</p></div>`;
            return;
        }

        let html = '';
        dataList.forEach(d => {
            let isPdf = d.tipe && d.tipe.toLowerCase().includes('pdf');
            let iconClass = isPdf ? 'bi-file-earmark-pdf-fill text-danger' : 'bi-file-earmark-word-fill text-primary';
            let dateStr = new Date(d.timestamp || Date.now()).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'});

            html += `
                <div class="col-md-4 col-lg-3 mb-4">
                    <div class="card h-100 border-0 shadow-sm card-doc">
                        <div class="card-body text-center d-flex flex-column">
                            <div class="mb-3">
                                <i class="bi ${iconClass}" style="font-size: 3rem;"></i>
                            </div>
                            <h6 class="fw-bold text-dark text-truncate px-2" title="${d.judul}">${d.judul}</h6>
                            <small class="text-muted mb-3"><i class="bi bi-calendar3"></i> ${dateStr}</small>
                            
                            <div class="mt-auto d-flex gap-2 justify-content-center">
                                <a href="https://drive.google.com/uc?export=view&id=${d.drive_id}" target="_blank" class="btn btn-sm btn-light border" title="Lihat">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <button onclick="hapusData('${d.key}')" class="btn btn-sm btn-outline-danger" title="Hapus">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
        grid.innerHTML = html;
    }

    // Event Listener Pencarian
    document.getElementById('searchBox').addEventListener('keyup', (e) => {
        const keyword = e.target.value.toLowerCase();
        const filtered = allDocs.filter(doc => doc.judul.toLowerCase().includes(keyword));
        renderGrid(filtered);
    });

    // =========================================================
    // 5. GOOGLE DRIVE & UPLOAD LOGIC (Perlu Window Global)
    // =========================================================
    
    let tokenClient;
    let gapiInited = false, gisInited = false;

    // Ekspos fungsi ke window agar bisa dipanggil script Google
    window.gapiLoaded = function() {
        gapi.load('client', async () => {
            await gapi.client.init({ apiKey: API_KEY, discoveryDocs: [DISCOVERY_DOC] });
            gapiInited = true; checkAuth();
        });
    }

    window.gisLoaded = function() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID, scope: SCOPES, callback: '',
        });
        gisInited = true; checkAuth();
    }

    function checkAuth() {
        if (gapiInited && gisInited) updateUI(false);
    }

    // Tombol Login Drive
    const authBtn = document.getElementById('authorize_button');
    if(authBtn) {
        authBtn.onclick = () => {
            tokenClient.callback = async (resp) => {
                if (resp.error) throw (resp);
                updateUI(true);
            };
            tokenClient.requestAccessToken({prompt: 'consent'});
        };
    }

    // Tombol Logout Drive
    const signoutBtn = document.getElementById('signout_button');
    if(signoutBtn) {
        signoutBtn.onclick = () => {
            const token = gapi.client.getToken();
            if (token) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
                updateUI(false);
            }
        };
    }

    function updateUI(isLoggedIn) {
        const btnLogin = document.getElementById('authorize_button');
        const btnLogout = document.getElementById('signout_button');
        const btnUpload = document.getElementById('btnUpload');
        const statusDiv = document.getElementById('drive-status');

        if(isLoggedIn) {
            btnLogin.style.display = 'none';
            btnLogout.style.display = 'inline-block';
            btnUpload.disabled = false;
            statusDiv.className = 'alert alert-success border py-2 mb-3';
            statusDiv.innerHTML = '<small><i class="bi bi-check-circle-fill"></i> <b>Terkoneksi Drive.</b> Siap upload.</small>';
        } else {
            btnLogin.style.display = 'inline-block';
            btnLogout.style.display = 'none';
            btnUpload.disabled = true;
            statusDiv.className = 'alert alert-warning border py-2 mb-3';
            statusDiv.innerHTML = '<small><i class="bi bi-exclamation-triangle"></i> Silakan <b>Login Drive</b> untuk mengupload file.</small>';
        }
    }

    // --- FUNGSI UPLOAD (GLOBAL) ---
    window.uploadToDrive = async function() { 
        const fileInput = document.getElementById('docFile');
        const judul = document.getElementById('docJudul').value;
        const file = fileInput.files[0];

        if (!file || !judul) {
            return Swal.fire({ title: 'Data Belum Lengkap', text: 'Mohon isi judul dan pilih file.', icon: 'warning' });
        }

        Swal.fire({
            title: 'Sedang Mengupload...',
            html: 'Mengirim file ke folder Google Drive...',
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });

        try {
            const accessToken = gapi.client.getToken().access_token;
            
            const metadata = { 
                'name': file.name, 
                'mimeType': file.type,
                'parents': [TARGET_FOLDER_ID]
            };

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', file);

            const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
                method: 'POST',
                headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                body: form
            });
            
            const driveData = await response.json();
            if(driveData.error) throw new Error(driveData.error.message);

            // Simpan ke Firebase (Pakai dbInstance yang didapat dari initAdminPage)
            if(!dbInstance) throw new Error("Koneksi Database belum siap.");

            await push(ref(dbInstance, 'arsip_drive'), {
                judul: judul,
                drive_id: driveData.id,
                tipe: file.type,
                timestamp: serverTimestamp()
            });

            Swal.fire('Berhasil Upload!', 'Dokumen sudah tersimpan.', 'success');
            document.getElementById('docJudul').value = '';
            document.getElementById('docFile').value = '';

        } catch (err) {
            console.error(err);
            Swal.fire('Gagal Upload', 'Terjadi kesalahan: ' + err.message, 'error');
        }
    }

    // --- FUNGSI HAPUS (GLOBAL) ---
    window.hapusData = function(key) {
        Swal.fire({
            title: 'Hapus Arsip?',
            text: "Link akan dihapus dari aplikasi. File di Drive harus dihapus manual.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonText: 'Batal',
            confirmButtonText: 'Ya, Hapus!'
        }).then((result) => {
            if (result.isConfirmed && dbInstance) {
                remove(ref(dbInstance, `arsip_drive/${key}`))
                .then(() => {
                    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                    Toast.fire({ icon: 'success', title: 'Data berhasil dihapus' });
                });
            }
        });
    }

  </script>
</body>
</html>
